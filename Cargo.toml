[workspace]
resolver = "2"
members = [
    "ir",
    "compiler",
    "runtime",
    "optimizer",
    "backends",
    "cli",
    "tools/npack",
    "tools/formatter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Neura Contributors"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
